<script type="module">
import * as THREE from "./three.module.min.js";
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const $=id=>document.getElementById(id);
let coins=+localStorage.kr3dCoins||0;
const SKINS=[["Classic Red",0,"#e8202a"],["Ocean Blue",50,"#1e6fff"],["Flames",100,"flames"],["Rainbow",150,"rainbow"],["Police",200,"police"],["Camo",250,"camo"],["Tiger",300,"tiger"],["Galaxy",400,"galaxy"],["Candy",450,"candy"],["Gold",600,"gold"]];
let owned=JSON.parse(localStorage.kr3dOwned||"[0]"),skin=+localStorage.kr3dSkin||0;
function save(){localStorage.kr3dCoins=coins;localStorage.kr3dOwned=JSON.stringify(owned);localStorage.kr3dSkin=skin}
function skinTex(k){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
 const f=(col,...a)=>{g.fillStyle=col;g.fillRect(...a)};
 if(k[0]=="#"){f(k,0,0,128,128)}
 else if(k=="flames"){f("#111",0,0,128,128);for(let i=0;i<8;i++){g.fillStyle=["#ff3b00","#ff9a00","#ffd400"][i%3];g.beginPath();g.moveTo(i*18,128);g.quadraticCurveTo(i*18+30,60,i*18+10,10+i%3*15);g.quadraticCurveTo(i*18+40,70,i*18+30,128);g.fill()}}
 else if(k=="rainbow"){["#f33","#f93","#fe3","#3c4","#39f","#93f"].forEach((col,i)=>f(col,0,i*22,128,22))}
 else if(k=="police"){f("#fff",0,0,128,128);f("#111",0,0,128,40);f("#111",0,88,128,40);f("#1e4fff",0,52,64,24);f("#f22",64,52,64,24)}
 else if(k=="camo"){f("#5b6b2f",0,0,128,128);for(let i=0;i<30;i++){g.fillStyle=["#3a4220","#8a8a4a","#2d2a1c"][i%3];g.beginPath();g.ellipse(Math.random()*128,Math.random()*128,10+Math.random()*12,6+Math.random()*8,Math.random()*3,0,7);g.fill()}}
 else if(k=="tiger"){f("#ff8c00",0,0,128,128);g.fillStyle="#111";for(let i=0;i<9;i++){g.beginPath();g.moveTo(i*15,0);g.lineTo(i*15+8,0);g.lineTo(i*15+14,70);g.lineTo(i*15+2,128);g.lineTo(i*15-2,70);g.fill()}}
 else if(k=="galaxy"){const gr=g.createLinearGradient(0,0,128,128);gr.addColorStop(0,"#1a0040");gr.addColorStop(.5,"#5a1a9a");gr.addColorStop(1,"#0a1a60");g.fillStyle=gr;g.fillRect(0,0,128,128);g.fillStyle="#fff";for(let i=0;i<60;i++)g.fillRect(Math.random()*128,Math.random()*128,2,2)}
 else if(k=="candy"){f("#fff",0,0,128,128);g.fillStyle="#ff4fa0";for(let i=-128;i<128;i+=24){g.beginPath();g.moveTo(i,0);g.lineTo(i+12,0);g.lineTo(i+140,128);g.lineTo(i+128,128);g.fill()}}
 else if(k=="gold"){const gr=g.createLinearGradient(0,0,128,128);gr.addColorStop(0,"#fff3a0");gr.addColorStop(.5,"#f5b800");gr.addColorStop(1,"#b07a00");g.fillStyle=gr;g.fillRect(0,0,128,128)}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const skinMats=SKINS.map(s=>new THREE.MeshStandardMaterial({map:skinTex(s[2]),metalness:s[2]=="gold"?.6:.1,roughness:.4}));
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
function makeKart(mat,hair,shirt){const k=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.6,3.4),mat);body.position.y=.6;k.add(body);
 const nose=new THREE.Mesh(new THREE.BoxGeometry(1.8,.4,1),mat);nose.position.set(0,.5,2.1);k.add(nose);
 const wing=new THREE.Mesh(new THREE.BoxGeometry(2.4,.15,.6),mat);wing.position.set(0,1.4,-1.6);k.add(wing);
 [-.8,.8].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.15,.6,.15),M(0x333333));p.position.set(x,1.1,-1.6);k.add(p)});
 const wg=new THREE.CylinderGeometry(.5,.5,.5,16);wg.rotateZ(Math.PI/2);k.wheels=[];
 [[-1.25,1.2],[1.25,1.2],[-1.25,-1.2],[1.25,-1.2]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,M(0x222222));w.position.set(x,.5,z);k.add(w);k.wheels.push(w)});
 const torso=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,.8,12),M(shirt));torso.position.set(0,1.25,-.3);k.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),M(0xffd2a6));head.position.set(0,1.95,-.3);k.add(head);
 const helm=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12,0,7,0,1.6),M(hair));helm.position.copy(head.position);helm.position.y+=.05;k.add(helm);
 [-.17,.17].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.08,8,6),M(0x111111));e.position.set(x,2,.1);k.add(e)});
 const sm=new THREE.Mesh(new THREE.TorusGeometry(.15,.04,6,12,Math.PI),M(0xaa2222));sm.position.set(0,1.82,.12);sm.rotation.z=Math.PI;k.add(sm);
 const bub=new THREE.Mesh(new THREE.SphereGeometry(2.6,16,12),new THREE.MeshStandardMaterial({color:0x66ccff,transparent:true,opacity:.35}));bub.position.y=1.2;bub.visible=false;k.add(bub);k.bub=bub;
 const sw=new THREE.Mesh(new THREE.TorusGeometry(.42,.07,8,20),M(0x222222));sw.position.set(0,1.75,.3);sw.rotation.x=-.5;k.add(sw);k.sw=sw;
 const dash=new THREE.Mesh(new THREE.BoxGeometry(1.6,.35,.5),M(0x333333));dash.position.set(0,1.05,.75);k.add(dash);
 k.head=[head,helm];
 k.body=body;k.nose=nose;k.wing=wing;k.traverse(o=>o.castShadow=true);return k}

// ---------- main scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x87ceeb);S.fog=new THREE.Fog(0x87ceeb,150,420);
const cam=new THREE.PerspectiveCamera(65,1,.1,800);
S.add(new THREE.HemisphereLight(0xffffff,0x66aa44,1.1));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(80,150,60);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-250,right:250,top:250,bottom:-250,far:500});sun.shadow.mapSize.set(2048,2048);S.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),M(0x5ccf4a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
// track
const N=600,W=16,pts=[];
for(let i=0;i<N;i++){const t=i/N*Math.PI*2,r=150*(1+.22*Math.sin(2*t)+.1*Math.cos(3*t));pts.push(new THREE.Vector3(Math.cos(t)*r*1.3,0,Math.sin(t)*r))}
const tan=pts.map((p,i)=>pts[(i+1)%N].clone().sub(pts[(i+N-1)%N]).normalize());
const nrm=tan.map(t=>new THREE.Vector3(-t.z,0,t.x));
function strip(w,y,col,stripe){const pos=[],cols=[],idx=[];const c=new THREE.Color();
 for(let i=0;i<=N;i++){const j=i%N;for(const s of[-1,1]){const p=pts[j].clone().addScaledVector(nrm[j],s*w);pos.push(p.x,y,p.z);c.set(stripe?((Math.floor(i/6)%2)?0xff2222:0xffffff):col);cols.push(c.r,c.g,c.b)}
  if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setAttribute("color",new THREE.Float32BufferAttribute(cols,3));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.9}));m.receiveShadow=true;S.add(m)}
strip(W+2,.02,0,true);strip(W,.04,0x55555f);
// center dashes + finish line
for(let i=0;i<N;i+=8){const d=new THREE.Mesh(new THREE.PlaneGeometry(.5,3),M(0xffffff));d.rotation.x=-Math.PI/2;d.rotation.z=-Math.atan2(tan[i].x,tan[i].z);d.position.copy(pts[i]).setY(.06);S.add(d)}
const fc=document.createElement("canvas");fc.width=128;fc.height=16;const fg=fc.getContext("2d");for(let x=0;x<16;x++)for(let y=0;y<2;y++){fg.fillStyle=(x+y)%2?"#000":"#fff";fg.fillRect(x*8,y*8,8,8)}
const fl=new THREE.Mesh(new THREE.PlaneGeometry(W*2,4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(fc)}));fl.rotation.x=-Math.PI/2;fl.rotation.z=-Math.atan2(tan[0].x,tan[0].z)+Math.PI/2;fl.position.copy(pts[0]).setY(.08);S.add(fl);
// finish arch
const arch=new THREE.Group();[-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,10),M(0xffffff));p.position.set(s*(W+2),5,0);arch.add(p)});
const ban=new THREE.Mesh(new THREE.BoxGeometry(W*2+5,2.5,.4),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(fc)}));ban.position.y=10;arch.add(ban);
arch.position.copy(pts[0]);arch.lookAt(pts[0].clone().add(nrm[0].clone().cross(new THREE.Vector3(0,1,0))));arch.rotation.y=Math.atan2(tan[0].x,tan[0].z);S.add(arch);
// scenery
const rnd=(a,b)=>a+Math.random()*(b-a);
function distTrack(x,z){let m=1e9;for(let i=0;i<N;i+=4){const d=(pts[i].x-x)**2+(pts[i].z-z)**2;if(d<m)m=d}return Math.sqrt(m)}
const trunkG=new THREE.CylinderGeometry(.5,.7,4),leafG=new THREE.SphereGeometry(3,10,8),coneG=new THREE.ConeGeometry(2.6,7,10);
for(let n=0;n<220;n++){const x=rnd(-320,320),z=rnd(-260,260);if(distTrack(x,z)<W+8)continue;const t=new THREE.Group();
 const tr=new THREE.Mesh(trunkG,M(0x8b5a2b));tr.position.y=2;t.add(tr);
 const lf=Math.random()<.5?new THREE.Mesh(leafG,M([0x2e9e3a,0x3cbf4a,0x1f7a2e][n%3])):new THREE.Mesh(coneG,M(0x23863a));lf.position.y=Math.random()<.5?6:7;t.add(lf);
 t.position.set(x,0,z);t.scale.setScalar(rnd(.8,1.5));t.traverse(o=>o.castShadow=true);S.add(t)}
// grandstands with crowd + flags
const crowd=[];
for(const gi of[30,170,330,470]){const p=pts[gi],o=nrm[gi].clone().multiplyScalar(W+12),g=new THREE.Group();
 for(let r=0;r<4;r++){const st=new THREE.Mesh(new THREE.BoxGeometry(30,1.5,3),M(r%2?0x2b6cff:0xffffff));st.position.set(0,r*1.5+.75,r*3);g.add(st);
  for(let c=0;c<12;c++){const fan=new THREE.Mesh(new THREE.SphereGeometry(.6,8,6),M(new THREE.Color().setHSL(Math.random(),.8,.55)));fan.position.set(-13.5+c*2.4,r*1.5+2.1,r*3);fan.userData.b=fan.position.y;g.add(fan);crowd.push(fan)}}
 const roof=new THREE.Mesh(new THREE.BoxGeometry(32,.5,14),M(0xff3355));roof.position.set(0,9,4.5);g.add(roof);
 g.position.copy(p).add(o);g.lookAt(p);g.rotateY(Math.PI);S.add(g)}
const flags=[];
for(let i=10;i<N;i+=40){for(const s of[-1,1]){const p=pts[i].clone().addScaledVector(nrm[i],s*(W+4));const pole=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,7),M(0xdddddd));pole.position.copy(p).setY(3.5);S.add(pole);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(2.5,1.5),new THREE.MeshStandardMaterial({color:[0xff3333,0xffdd00,0x33aaff,0x33dd55,0xff66cc][(i/40|0)%5],side:THREE.DoubleSide}));f.position.copy(p).setY(6.2);f.position.x+=1.2;S.add(f);flags.push(f)}}
// clouds
for(let i=0;i<14;i++){const c=new THREE.Group();for(let j=0;j<4;j++){const b=new THREE.Mesh(new THREE.SphereGeometry(rnd(6,10),10,8),new THREE.MeshBasicMaterial({color:0xffffff}));b.position.set(j*8,rnd(-2,2),rnd(-3,3));c.add(b)}c.position.set(rnd(-400,400),rnd(70,110),rnd(-400,400));S.add(c)}
// coins on track
const coinG=new THREE.CylinderGeometry(1,1,.25,16);coinG.rotateX(Math.PI/2);const coinM=new THREE.MeshStandardMaterial({color:0xffd700,metalness:.6,roughness:.3,emissive:0x664400});
const trackCoins=[];for(let i=40;i<N;i+=25){const c=new THREE.Mesh(coinG,coinM);c.position.copy(pts[i]).addScaledVector(nrm[i],rnd(-W*.6,W*.6)).setY(1.5);S.add(c);trackCoins.push(c)}

// ramps, boost pads, item boxes
const RAMPS=[130,310,470],PADS=[75,225,395,545],BOXI=[175,355,515];
function rampGeo(){const g=new THREE.BufferGeometry(),w=W*.55,L=7,H=1.8;
 const v=[-w,0,0,w,0,0,-w,H,L,w,H,L,-w,0,L,w,0,L];g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));g.setIndex([0,2,1,1,2,3,2,4,3,3,4,5,0,4,2,1,3,5]);g.computeVertexNormals();return g}
const rc=document.createElement("canvas");rc.width=64;rc.height=64;{const g=rc.getContext("2d");for(let i=0;i<8;i++){g.fillStyle=i%2?"#ffcc00":"#ff5500";g.fillRect(0,i*8,64,8)}}
RAMPS.forEach(i=>{const m=new THREE.Mesh(rampGeo(),new THREE.MeshStandardMaterial({color:0xffaa00,side:THREE.DoubleSide}));m.position.copy(pts[i]);m.rotation.y=Math.atan2(tan[i].x,tan[i].z);m.castShadow=m.receiveShadow=true;S.add(m)});
const ac=document.createElement("canvas");ac.width=64;ac.height=128;{const g=ac.getContext("2d");g.fillStyle="#00e5ff";g.fillRect(0,0,64,128);g.fillStyle="#fff";for(const y of[10,60]){g.beginPath();g.moveTo(32,y);g.lineTo(60,y+35);g.lineTo(44,y+35);g.lineTo(32,y+20);g.lineTo(20,y+35);g.lineTo(4,y+35);g.fill()}}
const padM=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ac),transparent:true});padM.map.wrapT=THREE.RepeatWrapping;
PADS.forEach(i=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(W*1.1,7),padM);m.rotation.x=-Math.PI/2;m.rotation.z=Math.atan2(tan[i].x,tan[i].z)+Math.PI;m.position.copy(pts[i]).setY(.09);S.add(m)});
const qc=document.createElement("canvas");qc.width=qc.height=64;{const g=qc.getContext("2d");g.fillStyle="#ff3ec8";g.fillRect(0,0,64,64);g.fillStyle="#fff";g.font="bold 50px Arial";g.textAlign="center";g.fillText("?",32,50)}
const boxM=new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(qc),transparent:true,opacity:.9,emissive:0x552255});
const boxes=[];BOXI.forEach(i=>[-8,0,8].forEach(o=>{const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2),boxM);b.position.copy(pts[i]).addScaledVector(nrm[i],o).setY(1.8);S.add(b);boxes.push(b)}));
const ITEMS=["turbo","banana","shield"],ICON={turbo:"🚀",banana:"🍌",shield:"🫧"};
const bananas=[];const banG=new THREE.SphereGeometry(.8,10,8);banG.scale(1.6,.5,1);const banM=M(0xffe135);
function useItem(k){const u=k.u,it=u.item;if(!it)return;u.item=null;
 if(it=="turbo"){u.boost=2;if(u.player)whoosh()}
 else if(it=="banana"){const b=new THREE.Mesh(banG,banM);b.position.set(k.position.x-Math.sin(u.h)*4,.4,k.position.z-Math.cos(u.h)*4);S.add(b);bananas.push(b);if(u.player)beep(300,.15,"triangle")}
 else{u.shield=6;if(u.player){beep(700,.3,"sine");say("Bubble shield!")}}}
function whoosh(){if(!AC)return;const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(i/n*Math.PI)*.5;
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(400,AC.currentTime);f.frequency.exponentialRampToValueAtTime(3000,AC.currentTime+.6);s.connect(f).connect(AC.destination);s.start()}
const near=(k,i,r)=>{let d=k.u.idx-i;if(d<-N/2)d+=N;if(d>N/2)d-=N;return d>=0&&d<r};
const fx=[];const starG=new THREE.OctahedronGeometry(.45),puffG=new THREE.SphereGeometry(.7,8,6);
function puff(x,z){for(let i=0;i<8;i++){const st=i%2==0;const m=new THREE.Mesh(st?starG:puffG,new THREE.MeshBasicMaterial({color:st?0xffe600:0xffffff,transparent:true}));m.position.set(x,1.5,z);
 const a=i/8*Math.PI*2;m.userData={vx:Math.cos(a)*5,vz:Math.sin(a)*5,vy:4+Math.random()*3,life:.7};S.add(m);fx.push(m)}}
function bonk(){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(520,AC.currentTime);o.frequency.exponentialRampToValueAtTime(140,AC.currentTime+.18);
 g.gain.setValueAtTime(.35,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.25);setTimeout(()=>beep(1200,.08,"triangle",.12),60)}
// ---------- karts ----------

 // player starts at the back
 const p=player,j=N-6-Math.floor((karts.length-1)/2)*8-8;p.u.idx=j;p.position.copy(pts[j]);p.u.h=Math.atan2(tan[j].x,tan[j].z);p.rotation.y=p.u.h;

  else if($("big").textContent!=n){$("big").textContent=n;beep(440,.3)}}
 const racing=state=="race"||state=="finish";
 karts.forEach((k,ki)=>{const u=k.u;if(!u)return;
  if(racing){
   if(u.player&&!u.done&&!window.__auto){const I=inp();

    const off=Math.abs(u.off)>W;const mx=(off?MAXS*.5:MAXS)*(u.boost>0?1.5:1);if(u.boost>0)u.speed+=40*dt;if(btn.I||keys[" "]){btn.I=0;keys[" "]=0;useItem(k)}u.speed=Math.max(-12,Math.min(mx,u.speed));if(off&&u.speed>mx)u.speed-=40*dt;
    const steer=(I.left?1:0)-(I.right?1:0);u.h+=steer*dt*1.9*Math.min(1,Math.abs(u.speed)/10)*Math.sign(u.speed||1);

   }else{ // AI (also drives player kart after finish)
    const sk=u.player?.8:u.skill,ahead=(u.idx+14)%N;
    // overtaking: look for a kart just ahead in my lane
    for(const o of karts){if(o==k||!o.u)continue;const gap=prog(o)-prog(k);if(gap>0&&gap<14&&Math.abs(o.u.off-u.lane)<4){u.lane=o.u.off>0?o.u.off-7:o.u.off+7;break}}
    u.lane=Math.max(-W+3,Math.min(W-3,u.lane+Math.sin(t*.3+ki)*.02));
    const tgt=pts[ahead].clone().addScaledVector(nrm[ahead],u.lane);
    const want=Math.atan2(tgt.x-k.position.x,tgt.z-k.position.z);let d=want-u.h;d=Math.atan2(Math.sin(d),Math.cos(d));u.h+=Math.max(-2,Math.min(2,d*3))*dt;

    let cap=MAXS*sk*(u.boost>0?1.5:1);if(u.item&&(u.it-=dt)<0)useItem(k);if(!u.player&&!player.u.done){const g=prog(k)-prog(player);if(g>60)cap*=.9;if(g<-80)cap*=1.08}
    u.speed+=(cap-u.speed)*dt*.8}
   if(u.spin>0){u.spin-=dt;u.speed*=1-2*dt}k.rotation.y=u.h+(u.spin>0?u.spin*12:0);k.position.x+=Math.sin(u.h)*u.speed*dt;k.position.z+=Math.cos(u.h)*u.speed*dt}
  // kart bumping
  for(let oi=ki+1;oi<karts.length;oi++){const o=karts[oi];if(!o.u)continue;const dx=k.position.x-o.position.x,dz=k.position.z-o.position.z,d=Math.hypot(dx,dz);
   if(d<3.2&&d>0){const nx=dx/d,nz=dz/d,pen=(3.2-d)*.5;k.position.x+=nx*pen;k.position.z+=nz*pen;o.position.x-=nx*pen;o.position.z-=nz*pen;
    if(racing&&(k.u.bc||0)<=0&&(o.u.bc||0)<=0){const kick=8;k.u.kx=nx*kick;k.u.kz=nz*kick;o.u.kx=-nx*kick;o.u.kz=-nz*kick;k.u.wob=o.u.wob=.6;k.u.bc=o.u.bc=.5;k.u.speed*=.9;o.u.speed*=.9;
     puff((k.position.x+o.position.x)/2,(k.position.z+o.position.z)/2);if(k.u.player||o.u.player)bonk();if(window.__bumps!=null)window.__bumps++}}}
  if(k.u.kx){k.position.x+=k.u.kx*dt;k.position.z+=k.u.kz*dt;k.u.kx*=1-5*dt;k.u.kz*=1-5*dt;if(Math.abs(k.u.kx)+Math.abs(k.u.kz)<.1)k.u.kx=k.u.kz=0}
  k.u.bc=Math.max(0,(k.u.bc||0)-dt);if(k.u.wob>0){k.u.wob-=dt;k.rotation.z=Math.sin(k.u.wob*30)*k.u.wob*.35}else k.rotation.z=0;
  k.wheels.forEach(w=>w.rotation.x+=u.speed*dt*2);if(racing){
   u.boost=Math.max(0,u.boost-dt);u.shield=Math.max(0,u.shield-dt);k.bub.visible=u.shield>0;
   if(u.y<=0&&u.speed>10&&RAMPS.some(i=>near(k,i,3))&&Math.abs(u.off)<W*.55){u.vy=11+u.speed*.12;u.y=.01;if(u.player)beep(500,.3,"sine")}
   if(u.y>0){u.vy-=28*dt;u.y+=u.vy*dt;if(u.y<=0){u.y=0;u.vy=0;if(u.player)beep(160,.12)}}
   if(u.y<=0&&PADS.some(i=>near(k,i,4))&&Math.abs(u.off)<W*.6&&u.boost<1){u.boost=1.5;if(u.player)whoosh()}
   for(const b of boxes)if(b.visible&&u.y<2&&b.position.distanceTo(k.position)<3.2){b.visible=false;setTimeout(()=>b.visible=true,3000);if(!u.item){u.item=ITEMS[Math.random()*3|0];u.it=1+Math.random()*4;if(u.player){beep(1000,.1,"triangle");beep(1500,.15,"triangle");say(u.item=="turbo"?"Turbo!":u.item=="banana"?"Banana!":"Bubble!")}}}
   for(let bi=bananas.length-1;bi>=0;bi--){const b=bananas[bi];if(u.y<1&&Math.hypot(b.position.x-k.position.x,b.position.z-k.position.z)<2.2){S.remove(b);bananas.splice(bi,1);if(u.shield>0){u.shield=0}else{u.spin=1;if(u.player){beep(250,.4,"sine");say("Whoops!")}}}}}
  k.position.y=u.y+Math.abs(Math.sin(t*20+ki))*.05*Math.min(1,u.speed/20);
  const pl=u.lap;nearest(k);
  if(racing&&u.lap>pl&&u.lap>=0&&!u.done){if(u.lap>=3){u.done=true;u.ft=now;if(u.player)finishRace()}else if(u.player){say(u.lap==2?"Last lap!":"Lap "+(u.lap+1));beep(660,.2,"triangle")}}
 });

 for(let i=fx.length-1;i>=0;i--){const m=fx[i],d=m.userData;d.life-=dt;m.position.x+=d.vx*dt;m.position.z+=d.vz*dt;m.position.y+=d.vy*dt;d.vy-=12*dt;m.rotation.y+=dt*8;m.material.opacity=Math.max(0,d.life/.7);if(d.life<=0){S.remove(m);fx.splice(i,1)}}

  $("pos").textContent=["🥇","🥈","🥉"][pos-1]||ord(pos);if(pos>3)$("pos").textContent=ord(pos);$("lap").textContent="Lap "+Math.min(3,Math.max(1,player.u.lap+1))+"/3";$("coins").textContent="🪙 "+(coins+raceCoins);$("slot").textContent=player.u.item?ICON[player.u.item]:"⬜";$("I").style.opacity=player.u.item?1:.4;
  if(engG)engG.gain.value=state=="race"?.05+Math.abs(player.u.speed)/MAXS*.06:0;if(eng)eng.frequency.value=60+Math.abs(player.u.speed)*4}
 // camera

 else{const p=player,h=p.u?p.u.h:0;const want=new THREE.Vector3(p.position.x-Math.sin(h)*11,5.5,p.position.z-Math.cos(h)*11);
